<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine for Shruti ❤️</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #ffb3c6, #ff6699);
        font-family: 'Poppins', sans-serif;
        overflow: hidden;
    }

    /* Floating Hearts */
    .heart {
        position: fixed;
        top: -20px;
        color: #ff1a75;
        font-size: 20px;
        animation: fall 4s linear infinite;
        opacity: 0.8;
        pointer-events: none;
    }
    @keyframes fall {
        from { transform: translateY(0) rotate(0); opacity: 1; }
        to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

    /* Sparkles floating */
    .sparkle {
        position: fixed;
        width: 6px;
        height: 6px;
        background: white;
        border-radius: 50%;
        opacity: 0.8;
        animation: sparkleMove 5s infinite linear;
        pointer-events: none;
    }
    @keyframes sparkleMove {
        from { transform: translateY(0); opacity: 1; }
        to { transform: translateY(100vh); opacity: 0; }
    }

    .box {
        background: white;
        padding: 32px;
        border-radius: 20px;
        text-align: center;
        width: 350px;
        box-shadow: 0 0 25px rgba(255, 0, 100, 0.4);
        animation: popUp 0.8s ease;
    }
    @keyframes popUp {
        from { transform: scale(0.6); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    h2 {
        font-size: 26px;
        font-weight: bold;
        color: #ff1a75;
        animation: glow 1.5s infinite alternate;
    }
    @keyframes glow {
        from { text-shadow: 0 0 10px #ff80bf; }
        to { text-shadow: 0 0 25px #ff0066; }
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 25px;
        position: relative;
    }

    button {
        padding: 12px 25px;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.2s;
    }

    #yesBtn {
        background: #ff1a75;
        color: white;
        box-shadow: 0 0 15px rgba(255, 51, 102, 0.5);
    }
    #yesBtn:hover { transform: scale(1.1); }

    #noBtn {
        background: black;
        color: white;
        position: relative;
    }

    #msg {
        margin-top: 15px;
        font-size: 16px;
        font-weight: bold;
        color: red;
        display: none;
        animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* LOVE SCREEN */
    #loveScreen {
        text-align: center;
        color: white;
        animation: fadeIn 1s ease;
        display: none;
    }

    #loveScreen h1 {
        font-size: 35px;
        animation: glow 1.5s infinite alternate;
    }

    .bigHeart {
        font-size: 80px;
        animation: beat 1.2s infinite;
    }
    @keyframes beat {
        0%   { transform: scale(1); }
        50%  { transform: scale(1.2); }
        100% { transform: scale(1); }
    }

</style>
</head>

<body>

<div class="box" id="mainBox">
    <h2>Shruti ❤️ Will you be my Valentine?</h2>

    <div class="buttons">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>

    <div id="msg"></div>
</div>

<!-- LOVE SCREEN -->
<div id="loveScreen">
    <h1>💖 I Love You Shruti 💖</h1>
    <div class="bigHeart">❤️</div>
</div>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const msg = document.getElementById("msg");
    const mainBox = document.getElementById("mainBox");
    const loveScreen = document.getElementById("loveScreen");

    /* HEART RAIN */
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.fontSize = (20 + Math.random() * 20) + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
    }, 300);

    /* SPARKLES */
    setInterval(() => {
        const s = document.createElement("div");
        s.classList.add("sparkle");
        s.style.left = Math.random() * window.innerWidth + "px";
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 5000);
    }, 400);

    /* NO BUTTON RUNS AWAY */
    noBtn.addEventListener("mouseenter", () => {
        noBtn.style.position = "absolute";
        const x = Math.random() * (window.innerWidth - 150);
        const y = Math.random() * (window.innerHeight - 150);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    });

    /* NO BUTTON CLICKED → MESSAGE BELOW */
    noBtn.addEventListener("click", () => {
        msg.style.display = "block";
        msg.innerHTML = "yeh click nhi hoga shrutu bby ❤️";
    });

    /* YES BUTTON → SHOW LOVE SCREEN + CONFETTI */
    yesBtn.addEventListener("click", () => {
        mainBox.style.display = "none";
        loveScreen.style.display = "block";

        // CONFETTI
        for (let i = 0; i < 60; i++) {
            const conf = document.createElement("div");
            conf.classList.add("heart");
            conf.innerHTML = "💘";
            conf.style.left = Math.random() * window.innerWidth + "px";
            conf.style.animationDuration = (2 + Math.random() * 2) + "s";
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 3000);
        }
    });
</script>

</body>
</html>
